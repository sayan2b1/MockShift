<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Primary Cap Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Shift Chevrons Gradient -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Gold Tassel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="240" r="140" fill="#00f5d4" opacity="0.16" filter="url(#glow)" />

  <!-- Futuristic Mortarboard Rhombus (Top Face) -->
  <polygon points="256,105 435,188 256,270 77,188" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Subtle White Edge Highlight on Top Face -->
  <polygon points="256,105 435,188 256,198 90,188" fill="#ffffff" opacity="0.28" />

  <!-- Cap Under-Ledge / Depth Geometry -->
  <path d="M 145,220 L 256,270 L 367,220 L 367,272 C 367,330 256,375 256,375 C 256,375 145,330 145,272 Z" fill="#090e17" stroke="url(#primaryGrad)" stroke-width="7" />

  <!-- Forward-pointing "Shift" Acceleration Chevrons inside Cap base -->
  <path d="M 215,268 L 265,296 L 215,324" fill="none" stroke="url(#chevronGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 252,268 L 302,296 L 252,324" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tassel Cord & Golden Jewel -->
  <path d="M 256,188 Q 395,195 422,290" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
  <circle cx="422" cy="298" r="11" fill="url(#goldGrad)" filter="url(#glow)" />
  <polygon points="422,306 414,332 430,332" fill="url(#goldGrad)" />

  <!-- Center Pin on Mortarboard -->
  <circle cx="256" cy="188" r="13" fill="#ffffff" />
  <circle cx="256" cy="188" r="7" fill="#090e17" />

  <!-- Futuristic AI Sparkle Star (Top Right) -->
  <path d="M 408,85 Q 408,118 440,118 Q 408,118 408,150 Q 408,118 375,118 Q 408,118 408,85 Z" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="408" cy="118" r="3.5" fill="#ffffff" />
</svg>
