<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="capG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="textShiftG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Icon -->
  <g transform="translate(10, 10)">
    <rect x="5" y="5" width="150" height="150" rx="36" fill="url(#bgBox)" stroke="url(#borderG)" stroke-width="4" />
    
    <!-- Cap Diamond -->
    <polygon points="80,32 136,58 80,84 24,58" fill="url(#capG)" filter="url(#logoGlow)" />
    <polygon points="80,32 136,58 80,62 30,58" fill="#ffffff" opacity="0.3" />

    <!-- Cap Base -->
    <path d="M 45,68 L 80,84 L 115,68 L 115,86 C 115,105 80,120 80,120 C 80,120 45,105 45,86 Z" fill="#090e17" stroke="url(#capG)" stroke-width="2.5" />

    <!-- Chevrons -->
    <path d="M 67,82 L 83,92 L 67,102" fill="none" stroke="#00f5d4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78,82 L 94,92 L 78,102" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tassel -->
    <path d="M 80,58 Q 124,60 132,90" fill="none" stroke="url(#goldG)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="132" cy="93" r="3.5" fill="url(#goldG)" />

    <!-- Center pin -->
    <circle cx="80,58" r="4.5" fill="#ffffff" />

    <!-- Star -->
    <path d="M 128,24 Q 128,34 138,34 Q 128,34 128,44 Q 128,34 118,34 Q 128,34 128,24 Z" fill="#00f5d4" />
  </g>

  <!-- Brand Typography -->
  <!-- "Mock" in crisp white -->
  <text x="185" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">Mock<tspan fill="url(#textShiftG)">Shift</tspan></text>

  <!-- Tagline / Subtitle -->
  <text x="188" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#00f5d4" letter-spacing="3.5">BYOP CBT AI SIMULATOR</text>

  <!-- Badge Pill -->
  <g transform="translate(525, 62)">
    <rect x="0" y="0" width="105" height="32" rx="16" fill="rgba(0, 245, 212, 0.12)" stroke="#00f5d4" stroke-width="1.5" />
    <text x="52" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#00f5d4" text-anchor="middle" letter-spacing="1">PRO CBT</text>
  </g>
</svg>
